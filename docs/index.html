<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anyaman Paling Kemas: Website to APK</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--muted:#8b949e;--accent:#1f6feb;--ok:#2ea043;--err:#f85149;--border:#30363d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 20px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:.85rem;color:var(--muted)}
input{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:.95rem;width:100%}
input:focus{outline:2px solid var(--accent);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px;font-size:1rem;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:.78rem;color:var(--muted)}
#status{margin-top:16px;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:.92rem;white-space:pre-wrap;display:none;overflow-wrap:anywhere}
#status.ok{border-color:var(--ok)}
#status.err{border-color:var(--err);color:var(--err)}
a.dl{display:inline-block;margin-top:10px;background:var(--ok);color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-weight:600}
@media (max-width:480px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Website to APK</h1>
  <p class="sub">Builds a signed Android app that loads your website live.</p>

  <form class="card" onsubmit="return false">
    <label>Website URL (https)
      <input id="url" type="url" placeholder="https://example.com" autocomplete="off">
    </label>

    <label>App name
      <input id="name" type="text" placeholder="My Shop" maxlength="30" autocomplete="off">
    </label>

    <label>Package ID (auto from app name, editable)
      <input id="pkg" type="text" autocomplete="off">
    </label>

    <div class="row">
      <label>Version name
        <input id="vname" type="text" value="1.0.0" autocomplete="off">
      </label>
      <label>Version code
        <input id="vcode" type="number" value="1" min="1" step="1">
      </label>
    </div>

    <label>Icon PNG (optional)
      <input id="icon" type="file" accept="image/png">
      <span class="hint">Leave empty to use the website's favicon or apple-touch-icon.</span>
    </label>

    <label>Repository (owner/name)
      <input id="repo" type="text" placeholder="anyaman/AnyamanPalingKemas" autocomplete="off">
    </label>

    <label>GitHub token (fine-grained, this repo only: Actions read/write, Contents read)
      <input id="token" type="password" autocomplete="off">
      <span class="hint">Saved in this browser's localStorage only. Never written to the repository.</span>
    </label>

    <button id="build" type="button">Build APK</button>
  </form>

  <div id="status"></div>
</main>

<script>
const WORKFLOW = 'build-apk.yml';
const BRANCH = 'main';
const $ = id => document.getElementById(id);
const el = {
  url: $('url'), name: $('name'), pkg: $('pkg'), vname: $('vname'), vcode: $('vcode'),
  icon: $('icon'), token: $('token'), repo: $('repo'), build: $('build'), status: $('status')
};
let pkgTouched = false;
let iconB64 = '';
const sleep = ms => new Promise(r => setTimeout(r, ms));

function slugify(name) {
  let s = name.toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!s) s = 'app';
  if (/^[0-9]/.test(s)) s = 'app' + s;
  return 'com.anyaman.' + s;
}

function defaultRepo() {
  if (!location.hostname.endsWith('.github.io')) return '';
  const owner = location.hostname.split('.')[0];
  const parts = location.pathname.split('/').filter(Boolean);
  return parts.length ? `${owner}/${parts[0]}` : `${owner}/${owner}.github.io`;
}

function show(text, kind = '', linkEl = null) {
  el.status.className = kind;
  el.status.textContent = text;
  if (linkEl) el.status.append(document.createElement('br'), linkEl);
  el.status.style.display = 'block';
}

function makeLink(href, label) {
  const a = document.createElement('a');
  a.href = href;
  a.textContent = label;
  a.className = 'dl';
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

async function gh(job, path, opts = {}) {
  const res = await fetch('https://api.github.com' + path, {
    method: opts.method || 'GET',
    body: opts.body,
    headers: {
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      Authorization: 'Bearer ' + job.token,
      ...(opts.body ? { 'Content-Type': 'application/json' } : {})
    }
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || 'HTTP ' + res.status);
  return data;
}

function collect() {
  const url = el.url.value.trim();
  const name = el.name.value.trim();
  const pkg = el.pkg.value.trim();
  const vname = el.vname.value.trim() || '1.0.0';
  const vcode = el.vcode.value.trim() || '1';
  const repo = el.repo.value.trim();
  const token = el.token.value.trim();
  const errs = [];
  if (!/^https:\/\/[A-Za-z0-9._~:\/?#@!$&()*+,;=%-]+$/.test(url)) errs.push('Website URL must start with https:// and contain no spaces or quotes.');
  if (!/^[A-Za-z0-9 ]{1,30}$/.test(name)) errs.push('App name: letters, digits and spaces only (max 30).');
  if (!/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(pkg)) errs.push('Package ID must look like com.anyaman.myapp');
  if (!/^[0-9A-Za-z.-]{1,20}$/.test(vname)) errs.push('Version name: letters, digits, dots and dashes only.');
  if (!/^[1-9][0-9]{0,8}$/.test(vcode)) errs.push('Version code must be a whole number of at least 1.');
  if (!/^[^/\s]+\/[^/\s]+$/.test(repo)) errs.push('Repository must be in owner/name form.');
  if (!token) errs.push('A GitHub token is required.');
  if (iconB64.length > 60000) errs.push('Icon is too large. Use a smaller or simpler PNG.');
  if (errs.length) { show(errs.join('\n'), 'err'); return null; }
  return {
    token, repo, pkg, vcode,
    inputs: {
      app_name: name,
      package_id: pkg,
      version_name: vname,
      version_code: vcode,
      target_url: url,
      icon_base64: iconB64
    }
  };
}

async function findRun(job, since) {
  for (let i = 0; i < 24; i++) {
    await sleep(5000);
    const data = await gh(job, `/repos/${job.repo}/actions/workflows/${WORKFLOW}/runs?event=workflow_dispatch&per_page=10`);
    const run = data.workflow_runs.find(r => Date.parse(r.created_at) >= since - 15000);
    if (run) return run;
  }
  throw new Error('Could not find the workflow run. Check the Actions tab of your repository.');
}

async function watch(job, runId) {
  const base = `/repos/${job.repo}`;
  for (let i = 0; i < 360; i++) {
    await sleep(5000);
    const run = await gh(job, `${base}/actions/runs/${runId}`);
    if (run.status !== 'completed') {
      show(`Build ${run.status}... (checked every 5 seconds)`);
      continue;
    }
    if (run.conclusion !== 'success') {
      show(`Build ${run.conclusion}. Open the run to read the logs.`, 'err', makeLink(run.html_url, 'Open run'));
      return;
    }
    const rel = await gh(job, `${base}/releases/tags/apk-${job.pkg}-${job.vcode}`);
    const asset = rel.assets.find(a => a.name.endsWith('.apk'));
    if (!asset) throw new Error('The release has no APK asset.');
    show('APK ready. Download it and allow installs from this source on your phone.', 'ok',
      makeLink(asset.browser_download_url, 'Download ' + asset.name));
    return;
  }
  throw new Error('Timed out waiting for the build.');
}

async function start() {
  const job = collect();
  if (!job) return;
  el.build.disabled = true;
  try {
    const since = Date.now();
    await gh(job, `/repos/${job.repo}/actions/workflows/${WORKFLOW}/dispatches`, {
      method: 'POST',
      body: JSON.stringify({ ref: BRANCH, inputs: job.inputs })
    });
    show('Build queued. Waiting for GitHub Actions to start...');
    const run = await findRun(job, since);
    await watch(job, run.id);
  } catch (e) {
    show('Error: ' + e.message, 'err');
  } finally {
    el.build.disabled = false;
  }
}

el.icon.addEventListener('change', async () => {
  iconB64 = '';
  const file = el.icon.files[0];
  if (!file) return;
  if (file.type !== 'image/png') {
    show('The icon must be a PNG file.', 'err');
    el.icon.value = '';
    return;
  }
  try {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    await img.decode();
    const canvas = document.createElement('canvas');
    canvas.width = 192;
    canvas.height = 192;
    canvas.getContext('2d').drawImage(img, 0, 0, 192, 192);
    URL.revokeObjectURL(url);
    iconB64 = canvas.toDataURL('image/png').split(',')[1];
  } catch {
    show('Could not read that image.', 'err');
    el.icon.value = '';
  }
});

el.token.value = localStorage.getItem('anyaman_pat') || '';
el.token.addEventListener('input', () => {
  const v = el.token.value.trim();
  if (v) localStorage.setItem('anyaman_pat', v);
  else localStorage.removeItem('anyaman_pat');
});

el.repo.value = defaultRepo();
el.pkg.value = slugify('');
el.name.addEventListener('input', () => {
  if (!pkgTouched) el.pkg.value = slugify(el.name.value.trim());
});
el.pkg.addEventListener('input', () => { pkgTouched = true; });
el.build.addEventListener('click', start);
</script>
</body>
</html>
